name: smoke

# 三週雲端開發期的安全網：任何 push / 平板上的改動都自動跑一次回歸測試。
# 判定依據＝ smoke.gd 第 151 行 quit(0 if failures == 0 else 1)。
on:
  push:
    branches: [master]
    tags: ['v*']       # tag push＝正式版發布信號，見 deploy-web-prod job
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.1-stable
  GODOT_BIN: Godot_v4.6.1-stable_linux.x86_64

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 還原 Godot 快取
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: 安裝 Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_BIN}.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/${GODOT_BIN}

      - name: 系統相依（headless 字型渲染）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1

      - name: 匯入資源（.godot/ 不進版控，CI 每次都要重建）
        run: |
          ~/godot/${GODOT_BIN} --headless --path spike_well --import > /tmp/import.log 2>&1 || true
          echo "--- import 尾段 ---"
          tail -15 /tmp/import.log
          grep -iE "ERROR|SCRIPT ERROR" /tmp/import.log | head -20 || echo "(import 無 error)"

      - name: 跑七組稽核 ＋ headless bot
        # ⚠ RC 一定要用 `|| RC=$?` 這種寫法捕捉，不能寫 `RC=$?` 另起一行：run: 預設
        #   shell 是 `bash -e`，Godot 那行只要非零結束，-e 會在讀到下一行「RC=$?」之前
        #   就整步中止，底下 echo／grep 的診斷輸出全部印不出來——job 只會顯示
        #   「Process completed with exit code 1」，看不到任何 [SMOKE]/!! 行，稽核到底
        #   壞在哪組完全不可見（08-20 x 實跑到這個坑：CI log 在指令印出後直接跳到
        #   ##[error]，中間的 echo／grep 輸出整段消失）。`|| RC=$?` 讓失敗被吸收在同一顆
        #   複合指令裡，-e 不會觸發，後面的診斷行照樣跑，最後仍靠 `exit $RC` 讓步驟正確
        #   標紅——修的是「看不看得到為什麼紅」，不是「紅不紅」的判定本身。
        run: |
          RC=0
          ~/godot/${GODOT_BIN} --headless --path spike_well res://smoke.tscn > /tmp/smoke.log 2>&1 || RC=$?
          echo "--- [SMOKE] 與 !! 行 ---"
          grep -E '^\[SMOKE\]|!!' /tmp/smoke.log || echo "(沒有任何 [SMOKE] 行——這本身就是異常)"
          echo "--- exit code: $RC ---"
          exit $RC

      - name: 保存完整 log（平板上可下載細看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/smoke.log
            /tmp/import.log
          retention-days: 30
  
  # ── 驗證通過才部署到「測試倉庫」。每次 push master 都會更新，當作發布前暫存資料庫。
  #    要推正式 public（raoras-basement）改走下面 deploy-web-prod：push 一個 v* tag 觸發。 ──
  deploy-web-test:
    needs: smoke
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 還原 Godot 快取
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: 安裝 Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_BIN}.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/${GODOT_BIN}

      - name: 還原 export templates 快取（600MB，別每次重抓）
        id: cache-tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: 安裝 export templates
        if: steps.cache-tpl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/tpl.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.6.1-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/4.6.1.stable
          ls ~/.local/share/godot/export_templates/4.6.1.stable | head -3

      - name: 系統相依
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1

      - name: 匯入資源
        run: ~/godot/${GODOT_BIN} --headless --path spike_well --import > /tmp/import.log 2>&1 || true

      - name: 匯出 Web 版
        # ⚠ RC 用 `|| RC=$?` 捕捉，理由同「跑七組稽核」那步的註解——避免 bash -e 在匯出
        #   失敗時把後面的 tail/ls 診斷輸出整段吃掉。
        run: |
          mkdir -p build_web
          RC=0
          ~/godot/${GODOT_BIN} --headless --path spike_well \
            --export-release "Web" ../build_web/index.html > /tmp/export.log 2>&1 || RC=$?
          tail -20 /tmp/export.log
          echo "--- 產出 ---"
          ls -la build_web/
          test -f build_web/index.html || { echo "!! index.html 沒產出，部署中止"; exit 1; }
          exit $RC

      - name: 上傳到 itch.io 測試倉庫（draft，暫存用，不是玩家看到的正式頁）
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -fsSL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          /tmp/butler/butler push build_web paperstormingowo/raoras-basement-test:html5 \
            --userversion "ci-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "→ https://paperstormingowo.itch.io/raoras-basement-test"

      - name: 保存 Web 產出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-web-test
          path: build_web/
          retention-days: 14

  # ── 正式 public 部署。只在 push 一個 v* tag 時觸發（例如 v0.4.1），平常 push master
  #    完全不會動到這裡，要發布新版時才下 tag。版本號來源＝ spike_config.gd GAME_VERSION。──
  deploy-web-prod:
    needs: smoke
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 還原 Godot 快取
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: 安裝 Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_BIN}.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/${GODOT_BIN}

      - name: 還原 export templates 快取（600MB，別每次重抓）
        id: cache-tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: 安裝 export templates
        if: steps.cache-tpl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/tpl.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.6.1-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/4.6.1.stable
          ls ~/.local/share/godot/export_templates/4.6.1.stable | head -3

      - name: 系統相依
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1

      - name: 匯入資源
        run: ~/godot/${GODOT_BIN} --headless --path spike_well --import > /tmp/import.log 2>&1 || true

      - name: 匯出 Web 版
        # ⚠ RC 用 `|| RC=$?` 捕捉，理由同「跑七組稽核」那步的註解——避免 bash -e 在匯出
        #   失敗時把後面的 tail/ls 診斷輸出整段吃掉。
        run: |
          mkdir -p build_web
          RC=0
          ~/godot/${GODOT_BIN} --headless --path spike_well \
            --export-release "Web" ../build_web/index.html > /tmp/export.log 2>&1 || RC=$?
          tail -20 /tmp/export.log
          echo "--- 產出 ---"
          ls -la build_web/
          test -f build_web/index.html || { echo "!! index.html 沒產出，部署中止"; exit 1; }
          exit $RC

      - name: 上傳到 itch.io 正式頁（玩家看得到的那個）
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -fsSL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          /tmp/butler/butler push build_web paperstormingowo/raoras-basement:html5 \
            --userversion "${GITHUB_REF_NAME}"
          echo "→ https://paperstormingowo.itch.io/raoras-basement (${GITHUB_REF_NAME})"

      - name: 保存 Web 產出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-web-prod
          path: build_web/
          retention-days: 14
